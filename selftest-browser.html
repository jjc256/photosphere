<!doctype html>
<meta charset="utf-8">
<title>PhotoSphere renderer regression checks</title>
<pre id="result">Running…</pre>
<canvas id="canvas" width="512" height="256"></canvas>
<script type="module">
import { PanoEngine } from './js/pano.js';
import { filmPoint, renderCamera } from './js/camera-geometry.js';
import { bundleAdjust, matT3, expSO3, matVec3 } from './js/ba.js';
import { featureBackend } from './js/cv-features.js';

const assert = (ok, message) => { if (!ok) throw new Error(message); };
try {
  const engine = new PanoEngine(document.querySelector('canvas'), { size: 512 });
  engine._initComposite();
  const gl = engine.gl, logs = [];
  // A source-coordinate ramp makes incorrect flips, centres and lens warps
  // directly measurable in the actual WebGL output, without visual guessing.
  const img = new ImageData(800, 600);
  for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) {
    const i = (y * img.width + x) * 4;
    img.data.set([255 * (x + 0.5) / img.width, 255 * (y + 0.5) / img.height, 128, 255], i);
  }
  const R = expSO3([0.15, -0.3, 0.12]);
  for (const vidRot of [0, 1, 2, 3]) for (const L of [0, 1, 1.8, -0.7]) {
    const shot = { w: 400, h: 300, vidRot };
    const focal = 0.55, scale = 1.18, a = -0.16, b = 0.08, c = -0.02;
    const camera = renderCamera(shot, { focalScale: scale, cx: 0.02, cy: -0.015 }, focal);
    engine._k1 = a * focal; engine._k2 = b * focal ** 2; engine._k3 = c * focal ** 3;
    engine._linearity = L;
    engine._uploadFrame(img);
    gl.bindFramebuffer(gl.FRAMEBUFFER, engine.wFbo);
    gl.viewport(0, 0, 512, 256);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(engine.pWarpC);
    engine._warpUniforms(engine.pWarpC, matT3(R), 1, 1, 1, vidRot, camera, img);
    engine._quad();
    const pixels = new Uint8Array(512 * 256 * 4);
    gl.readPixels(0, 0, 512, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let checked = 0, maxError = 0;
    for (let y = 1; y < 256; y += 3) for (let x = 1; x < 512; x += 3) {
      const lon = ((x + 0.5) / 512 - 0.5) * 2 * Math.PI;
      const lat = ((y + 0.5) / 256 - 0.5) * Math.PI;
      const d = matVec3(matT3(R), [Math.cos(lat) * Math.sin(lon), Math.sin(lat), -Math.cos(lat) * Math.cos(lon)]);
      const theta = Math.acos(-d[2]), i = (y * 512 + x) * 4;
      if (d[2] >= 0 || Math.abs(L) * theta >= Math.PI / 2) {
        assert(pixels[i + 3] === 0, 'projection folded outside its valid branch'); continue;
      }
      const r = focal * scale * (L === 0 ? theta : L > 0 ? Math.tan(theta * L) / L : Math.sin(theta * L) / L);
      // For this fixture every sensor corner lies below film radius 1 on
      // the first branch. Larger radii can only fold back into the image.
      if (r > 1) { assert(pixels[i + 3] === 0, 'radial polynomial painted a remote ring'); continue; }
      const rd = r + a * r ** 2 + b * r ** 3 + c * r ** 4;
      const fx = rd * d[0] / Math.hypot(d[0], d[1]) + 0.02;
      const fy = rd * d[1] / Math.hypot(d[0], d[1]) - 0.015;
      const angle = vidRot * Math.PI / 2;
      const u = 0.5 + Math.cos(angle) * fx - Math.sin(angle) * fy;
      const v = 0.5 + (Math.sin(angle) * fx + Math.cos(angle) * fy) * 400 / 300;
      if (u < 0.01 || u > 0.99 || v < 0.01 || v > 0.99) continue;
      assert(pixels[i + 3] === 255, 'missing valid warp coverage');
      maxError = Math.max(maxError, Math.abs(pixels[i] - u * 255), Math.abs(pixels[i + 1] - (1 - v) * 255));
      const film = filmPoint(u * 400, (1 - v) * 300, shot);
      assert(Math.hypot(film[0] - fx, film[1] - fy) < 1e-10, 'feature and renderer axes disagree');
      checked++;
    }
    assert(checked > 100 && maxError < 2, `warp turn=${vidRot}, L=${L}: error ${maxError}, samples ${checked}`);
    logs.push(`turn=${vidRot}, L=${L}: ${checked} pixels, max error ${maxError.toFixed(2)}/255`);
  }
  // Full seam/blend chain must preserve a single source right to its border;
  // a zero-priority label used to fail the depth test and leave holes there.
  const identity = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  // r - r^3 returns to zero at r=1 (45 degrees for a pinhole). That remote
  // circle must not sample the source centre of this narrow-FOV image.
  engine.compositeStitched([{ img, R: identity, gain: 1 }], 0.2, 0.2, 0, -1, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, engine.panoFbo);
  const remote = new Uint8Array(4);
  gl.readPixels(320, 128, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, remote);
  assert(remote[3] === 0, 'radial fold created a duplicate image ring');
  logs.push('radial polynomial: remote folded rays rejected');
  engine.compositeStitched([{ img, R: identity, gain: 1 }], 0.5, 0.375);
  gl.bindFramebuffer(gl.FRAMEBUFFER, engine.panoFbo);
  const blended = new Uint8Array(512 * 256 * 4);
  gl.readPixels(0, 0, 512, 256, gl.RGBA, gl.UNSIGNED_BYTE, blended);
  let covered = 0;
  for (let y = 0; y < 256; y++) for (let x = 0; x < 512; x++) {
    const lon = ((x + 0.5) / 512 - 0.5) * 2 * Math.PI;
    const lat = ((y + 0.5) / 256 - 0.5) * Math.PI;
    if (Math.cos(lon) <= 0) continue;
    const px = Math.tan(lon) / 0.5, py = Math.tan(lat) / Math.cos(lon) / 0.375;
    if (Math.max(Math.abs(px), Math.abs(py)) >= 0.99) continue;
    const i = (y * 512 + x) * 4;
    assert(blended[i + 3] === 255, 'seam labelling left a covered pixel empty');
    assert(Math.abs(blended[i] - (px * 0.5 + 0.5) * 255) < 3, 'compositor changed source pixels');
    covered++;
  }
  logs.push(`compositor: ${covered} source pixels preserved`);
  // Wide blur must be a continuous kernel, not 13 widely spaced copies of
  // the source. A vertical stripe used to produce a comb of visible lines.
  const stripe = new ImageData(512, 256);
  for (let y = 0; y < 256; y++) for (let x = 252; x < 260; x++) stripe.data.fill(255, (y * 512 + x) * 4, (y * 512 + x) * 4 + 4);
  gl.bindTexture(gl.TEXTURE_2D, engine.wTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, stripe);
  engine._blur(engine.wTex, engine.mFbo, engine.pingTex, engine.pingFbo, 24);
  gl.bindFramebuffer(gl.FRAMEBUFFER, engine.mFbo);
  const blurred = new Float32Array(512 * 256 * 4);
  gl.readPixels(0, 0, 512, 256, gl.RGBA, gl.FLOAT, blurred);
  let runs = 0, wasLit = false;
  for (let x = 0; x < 512; x++) {
    const lit = blurred[(128 * 512 + x) * 4] > 1 / 255;
    if (lit && !wasLit) runs++;
    wasLit = lit;
  }
  assert(runs === 1, `wide blur produced ${runs} separate stripes`);
  logs.push('wide blur: one continuous lobe');
  // Restore captured coverage in every direction, including frames whose
  // features did not join the main group. These remain lower seam priority.
  const solid = new ImageData(128, 128);
  for (let i = 0; i < solid.data.length; i += 4) solid.data.set([100, 140, 180, 255], i);
  const ring = Array.from({ length: 12 }, (_, i) => ({ img: solid, R: expSO3([0, i * Math.PI / 6, 0]), gain: 1, weak: i >= 6 }));
  engine.compositeStitched(ring, 0.6, 0.6);
  gl.bindFramebuffer(gl.FRAMEBUFFER, engine.panoFbo);
  gl.readPixels(0, 0, 512, 256, gl.RGBA, gl.UNSIGNED_BYTE, blended);
  for (let y = 100; y < 156; y++) for (let x = 0; x < 512; x++) {
    const i = (y * 512 + x) * 4;
    assert(blended[i + 3] === 255, `captured sphere missing at ${x},${y}`);
    assert(Math.abs(blended[i] - 100) < 2 && Math.abs(blended[i + 1] - 140) < 2, 'bands appeared in constant-colour overlap');
  }
  logs.push('360-degree ring: full captured coverage including secondary frames');
  // A centred fallback must not take ownership from a verified frame even
  // near that verified frame's border, where its border-distance score is low.
  engine.compositeStitched([
    { img: solid, R: identity, gain: 1 },
    { img: solid, R: expSO3([0, -0.45, 0]), gain: 1, weak: true },
  ], 0.6, 0.6);
  gl.bindFramebuffer(gl.FRAMEBUFFER, engine.labelFbo);
  gl.readPixels(294, 128, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, remote);
  assert(remote[0] === 1, 'fallback replaced verified seam ownership');
  logs.push('seam ownership: verified pixels win over fallback frames');
  // Six overlapping cube-face views cover the poles and longitude wrap too.
  // Unlike a flat-colour fixture, world-space colour gradients reveal seams.
  const colour = (d) => [128 + 70 * d[0], 128 + 60 * d[1], 128 + 50 * d[2]];
  const cube = [identity, expSO3([0, Math.PI, 0]), expSO3([0, Math.PI / 2, 0]), expSO3([0, -Math.PI / 2, 0]), expSO3([Math.PI / 2, 0, 0]), expSO3([-Math.PI / 2, 0, 0])].map((R, k) => {
    const img = new ImageData(160, 160);
    for (let y = 0; y < 160; y++) for (let x = 0; x < 160; x++) {
      const ray = matVec3(R, [((x + 0.5) / 80 - 1) * 1.2, (1 - (y + 0.5) / 80) * 1.2, -1]);
      const n = Math.hypot(...ray);
      img.data.set([...colour(ray.map((v) => v / n)), 255], (y * 160 + x) * 4);
    }
    return { img, R, gain: 1, weak: k > 2, connected: k === 3 };
  });
  engine.compositeStitched(cube, 1.2, 1.2);
  // Exercise the real export texture and vertical flip, not only a scratch FBO.
  const exported = engine.exportEquirect().getContext('2d').getImageData(0, 0, 512, 256).data;
  let maxSeamError = 0, sumSeamError = 0;
  for (let y = 0; y < 256; y++) for (let x = 0; x < 512; x++) {
    const lon = ((x + 0.5) / 512 - 0.5) * 2 * Math.PI;
    const lat = (0.5 - (y + 0.5) / 256) * Math.PI;
    const expected = colour([Math.cos(lat) * Math.sin(lon), Math.sin(lat), -Math.cos(lat) * Math.cos(lon)]);
    const i = (y * 512 + x) * 4;
    assert(exported[i + 3] === 255, `full-sphere coverage hole at ${x},${y}`);
    for (let c = 0; c < 3; c++) {
      const error = Math.abs(exported[i + c] - expected[c]);
      maxSeamError = Math.max(maxSeamError, error); sumSeamError += error;
    }
  }
  const meanSeamError = sumSeamError / (512 * 256 * 3);
  assert(maxSeamError < 6 && meanSeamError < 1.5, `gradient seam error: max=${maxSeamError}, mean=${meanSeamError}`);
  assert(engine.coverageBounds().full, 'export coverage ignored the stitched panorama');
  logs.push(`full sphere/export: no holes, mean colour error ${meanSeamError.toFixed(2)}, max ${maxSeamError.toFixed(2)}/255`);
  const cameras = [{ focalScale: 0.94, cx: 0.01, cy: -0.02 }, { focalScale: 1.07, cx: -0.01, cy: 0.03 }];
  const ba = bundleAdjust([{}, {}], [R, R], [], { focal0: 0.6, cx: 0, cy: 0, initialCameras: cameras, iters: 0 });
  assert(JSON.stringify(ba.cameras) === JSON.stringify(cameras), 'BA discarded camera calibration');
  // Exercise the production SIFT loader as well as shader compilation.
  const vision = await featureBackend();
  assert(vision.kind === 'OpenCV SIFT', `unexpected backend: ${vision.kind}`);
  const texture = document.createElement('canvas'); texture.width = texture.height = 256;
  const ctx = texture.getContext('2d'); ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 90; i++) {
    ctx.fillStyle = i % 2 ? '#eee' : '#777'; ctx.beginPath();
    ctx.arc((i * 73) % 256, (i * 113) % 256, 3 + i % 13, 0, 2 * Math.PI); ctx.fill();
  }
  const rgba = ctx.getImageData(0, 0, 256, 256).data;
  const gray = Uint8Array.from({ length: 256 * 256 }, (_, i) => rgba[i * 4]);
  const features = vision.detect(gray, 256, 256);
  assert(features.kps.length > 0 && vision.match(features, features).length > 0, 'SIFT detection/matching failed');
  assert(gl.getError() === gl.NO_ERROR, 'WebGL error');
  window.testResult = { ok: true, logs };
  document.querySelector('#result').textContent = 'PASS\n' + logs.join('\n');
} catch (error) {
  window.testResult = { ok: false, error: error.stack };
  document.querySelector('#result').textContent = 'FAIL\n' + error.stack;
}
</script>
